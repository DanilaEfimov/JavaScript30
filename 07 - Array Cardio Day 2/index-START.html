<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 },
      { name: `Danila`, year: 2005 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 },
      { text: `Nice playlist, Wes, bro`, id: 0xCAFEBABE }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?

    // it's an ablsolute Python any(...) synonym
    const isAdult = people.some(function(person) {
      const currentYear = (new Date()).getFullYear();
      return (currentYear - person.year > 18);
    });

    // or in a single line
    // const isAdult = people.some(person => ((new Date()).getFullYear() - person.year) > 18);

    console.log({isAdult});

    // Array.prototype.every() // is everyone 19 or older?

    const allAdult = people.every(person => ((new Date()).getFullYear()) - person.year > 18);
    console.log({allAdult});

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423

    const bestComment = comments.find(comment => (comment.id === 823423));

    // or in a multi-line way
    // const bestComment = comments.find(function(comment) {
    //   if(comment.id === 823423) {
    //     return true;
    //   }
    //   // default false
    // });

    console.log(bestComment.text);

    // Array.prototype.findIndex()
    // Find the comment with this ID
    // delete the comment with the ID of 823423

    // kinda argmax
    const thatCommentsIndex = comments.findIndex(comment => (comment.id === 823423));
    console.log(`that comment's imdex: ${thatCommentsIndex}`);
    console.log(`that comment's text: ${comments[thatCommentsIndex].text}`);

    // spread operator + splice bonus!
    const newComments = [
      ...comments.splice(0, thatCommentsIndex),
      ...comments.splice(thatCommentsIndex + 1)
    ];

    console.log(`by some reason we have removed that comment...`);
    console.table(newComments);

  </script>
</body>
</html>
