<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Canvas</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
<canvas id="draw" width="800" height="800"></canvas>
<script>
const canvas = document.querySelector(`#draw`);
const ctx = canvas.getContext(`2d`);
canvas.width = window.innerWidth;
canvas.heigh = window.innerHeight;

let isDrawing = false;
let lastX = 0;
let lastY = 0;
let hue = 0;
let lineWidth = 10;
const maxLineWidth = 50;
const lineWidthIncrement = 0.15;
let t = 0;  // lien width evolution time

ctx.strokeStyle = `#BADA55`;
ctx.lineJoin = `round`;  // or square e.g.
ctx.lineCap = `round`;
ctx.lineWidth = lineWidth;
ctx.globalCompositeOperation = `multiply`;


function updateContext() {
  ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
}

function updateVariables(e) {
  [lastX, lastY] = [e.offsetX, e.offsetY];
  hue = (hue+1) % 360;

  // no conditions in hot calculations !!!
  t = (t+lineWidthIncrement) % (2*maxLineWidth);
  lineWidth = Math.abs(maxLineWidth - Math.abs((t - maxLineWidth)));
}

function draw(e) {
  if (!isDrawing) return;

  // start from
  updateContext();

  // goto
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();

  updateVariables(e);
}

// callbacks
canvas.addEventListener(`mousemove`, draw);
canvas.addEventListener(`mousedown`, (e) => {
  isDrawing = true;
  [lastX, lastY] = [e.x, e.y];
});
canvas.addEventListener(`mouseup`, () => {isDrawing = false;});
canvas.addEventListener(`mouseout`, () => {isDrawing = false;});

</script>
<style>
  html, body {
    margin: 0;
  }
</style>

</body>
</html>
